<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#135E59">
  <meta name="robots" content="noindex, nofollow">
  <title>Offline - Aryal Store</title>
  <style>
    :root {
      --ivory: #F7F1E3;
      --surface: #FFFCF5;
      --teal: #135E59;
      --teal-deep: #0C4642;
      --gold: #C7A04A;
      --ink: #133B38;
      --muted: #4B6661;
      --line: #DED2BC;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 12% 8%, rgba(199, 160, 74, 0.16), transparent 32%),
        radial-gradient(circle at 88% 92%, rgba(19, 94, 89, 0.12), transparent 36%),
        var(--ivory);
      color: var(--ink);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .offline-card {
      width: min(100%, 440px);
      padding: 44px 32px 36px;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(19, 59, 56, 0.12);
    }
    .mark {
      width: 76px;
      height: 76px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--teal);
      color: var(--gold);
      box-shadow: 0 0 0 6px rgba(199, 160, 74, 0.16);
    }
    .mark svg { width: 38px; height: 38px; }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--gold);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 12px;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(2rem, 8vw, 2.6rem);
      line-height: 1.1;
      color: var(--teal-deep);
    }
    p {
      margin: 0 auto 22px;
      max-width: 32ch;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.65;
    }
    .retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 12px 28px;
      border-radius: 999px;
      background: var(--teal);
      color: #FFF9ED;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .retry:hover { background: var(--teal-deep); transform: translateY(-1px); }
    .retry:focus-visible { outline: 3px solid rgba(199, 160, 74, 0.55); outline-offset: 3px; }
    .hint { margin: 20px 0 0; font-size: 0.78rem; color: var(--muted); }
  </style>
</head>
<body>
  <main class="offline-card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9.5 4.5 4h15L21 9.5"/>
        <path d="M4.5 9.5V20h15V9.5"/>
        <path d="M9 20v-6h6v6"/>
      </svg>
    </div>
    <p class="eyebrow">Aryal Store</p>
    <h1>You are offline</h1>
    <p>Your connection dropped. Reconnect to keep shopping, or try again when you are back online.</p>
    <a class="retry" href="/">Try again</a>
    <p class="hint">Your saved pages may still be available.</p>
  </main>
  <script>
    window.addEventListener('online', function () { window.location.reload(); });
  </script>
</body>
</html>
